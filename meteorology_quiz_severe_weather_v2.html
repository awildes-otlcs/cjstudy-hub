<title>Severe Weather Quiz – Lessons 1–3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{

}
@media (prefers-color-scheme:dark){

    --sky:#0F1722; --card:#18222F; --ink:#C9DAF2; --text:#E6EDF4; --muted:#9AAABB; --line:#2E3C4D;

}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sky);color:var(--text);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.5;min-height:100vh}
.wrap{max-width:700px;margin:0 auto;padding:26px 18px 60px}
.front{display:block;width:100%;height:30px;margin-bottom:12px}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:2.3rem;line-height:1.05;margin:0 0 6px;color:var(--ink)}
.sub{color:var(--muted);margin:0 0 22px}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:22px}
.modes{display:grid;gap:10px;margin:16px 0}
.mode{display:block;text-align:left;width:100%;background:transparent;border:1.5px solid var(--line);border-left:6px solid var(--lc,var(--ink));border-radius:8px;padding:12px 14px;font:inherit;color:var(--text);cursor:pointer}
.mode strong{display:block;color:var(--ink)}
.mode span{color:var(--muted);font-size:.9rem}
.mode:hover,.mode:focus-visible{background:var(--pick);outline:none}
.l1{--lc:var(--cold)} .l2{--lc:var(--warm)} .l3{--lc:var(--noreast)}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px;color:var(--muted);font-size:.95rem}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--cold);transition:width .25s}
.section{font-size:.95rem;font-weight:700;margin:0 0 6px;color:var(--lc)}
.prompt{font-size:1.15rem;font-weight:700;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{text-align:left;font:inherit;color:var(--text);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:11px 14px;cursor:pointer;display:flex;gap:10px}
.opt b{color:var(--ink)}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:var(--ink);outline:none;background:var(--pick)}
.opt:disabled{cursor:default}
.opt.right{background:var(--green-soft);border-color:var(--green)}
.opt.wrong{background:var(--red-soft);border-color:var(--red);text-decoration:line-through;text-decoration-color:var(--red)}
.fb{min-height:1.5em;margin:14px 0 0}
.fb b{display:block}
.fb.ok b{color:var(--green)} .fb.no b{color:var(--red)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{font:inherit;font-weight:700;background:var(--btn);color:var(--btn-text);border:none;border-radius:8px;padding:11px 18px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn:focus-visible{outline:3px solid var(--cold);outline-offset:2px}
.score{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:4rem;line-height:1;color:var(--ink);margin:6px 0}
.miss{border-top:1px dashed var(--muted);padding:12px 0}
.miss p{margin:2px 0}
.miss .y{color:var(--red)} .miss .c{color:var(--green);font-weight:700} .miss .x{color:var(--muted);font-size:.92rem}
.key h3{margin:22px 0 6px;color:var(--lc)}
.key ol{padding-left:22px;margin:0}
.key li{margin:0 0 10px}
.key .c{color:var(--green);font-weight:700}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

    <div class="actions" style="margin-top:4px"><button class="btn ghost" id="keyBtn">Show answer key</button></div>
  </div>

  <div id="quiz" class="panel hidden">

    <div class="bar"><i id="prog" style="width:0"></i></div>
    <p class="section" id="sec"></p>
    <div class="prompt" id="prompt"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <div class="actions"><button class="btn hidden" id="next">Next question</button><button class="btn ghost" id="quit">Back to menu</button></div>

    <div class="score" id="final"></div>
    <p id="msg" style="margin-top:0"></p>
    <div class="actions">

    <div id="misses" style="margin-top:20px"></div>

  <div id="key" class="panel key hidden">
    <h2 style="margin:0">Answer key</h2>
    <div class="actions"><button class="btn ghost" id="keyHome">Back to menu</button></div>
    <div id="keyBody"></div>
  </div>
</div>

const LNAME = {1:"Lesson 1: Air masses",2:"Lesson 2: Fronts & cyclones",3:"Lesson 3: Nor’easters"};
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const $ = id => document.getElementById(id);

function build(mode){
  let list;
  if(mode==="MIX") list = shuffle(POOL).slice(0,25);
  else if(mode==="ALL") list = shuffle(POOL);
  else list = shuffle(POOL.filter(q=>q.l===+mode));
  return list.map(q=>({...q, ans:q.o[q.a], opts: q.tf ? [...q.o] : shuffle(q.o)}));
}

let Q=[], i=0, right=0, missed=[], curMode="MIX";
function show(id){["start","quiz","done","key"].forEach(x=>$(x).classList.toggle("hidden",x!==id)); window.scrollTo(0,0);}
function begin(list){ Q=list; i=0; right=0; missed=[]; show("quiz"); render(); }

function render(){
  const q=Q[i];
  $("count").textContent=`Question ${i+1} of ${Q.length}`;
  $("tally").textContent=`${right} correct so far`;
  $("prog").style.width=(i/Q.length*100)+"%";
  $("sec").textContent=LNAME[q.l];
  $("sec").className="section l"+q.l;
  $("prompt").textContent=q.q;
  $("fb").innerHTML=""; $("fb").className="fb";
  $("next").classList.add("hidden");
  $("opts").innerHTML="";
  q.opts.forEach((t,k)=>{
    const b=document.createElement("button");
    b.className="opt";
    const lab=document.createElement("b"); lab.textContent="abcd"[k]+".";
    const sp=document.createElement("span"); sp.textContent=t;
    b.append(lab,sp);
    b.onclick=()=>answer(b,t);
    $("opts").appendChild(b);
  });
  $("opts").firstChild.focus({preventScroll:true});
}

function answer(btn,t){
  const q=Q[i], ok=t===q.ans;
  [...$("opts").children].forEach(b=>{ b.disabled=true; if(b.querySelector("span").textContent===q.ans) b.classList.add("right"); });
  if(ok){ right++; $("fb").className="fb ok"; $("fb").innerHTML="<b>Correct!</b>"; }
  else { btn.classList.add("wrong"); missed.push({...q,given:t}); $("fb").className="fb no"; $("fb").innerHTML="<b></b>"; $("fb").firstChild.textContent=`Not quite. The answer is “${q.ans}.”`; }
  const ex=document.createElement("span"); ex.textContent=q.e; $("fb").appendChild(ex);
  $("tally").textContent=`${right} correct so far`;
  $("next").textContent = i===Q.length-1 ? "See my score" : "Next question";
  $("next").classList.remove("hidden"); $("next").focus();
}

$("next").onclick=()=>{ i++; i<Q.length ? render() : finish(); };

function finish(){
  $("prog").style.width="100%";
  const pct=Math.round(right/Q.length*100);
  $("final").textContent=`${right}/${Q.length}`;
  $("msg").textContent = pct===100 ? "Perfect score. You’re ready." :
    pct>=90 ? `${pct}%. Great work – just tidy up the few below.` :
    pct>=75 ? `${pct}%. Solid. Go over the misses below, then practice the missed ones.` :
    `${pct}%. Review the misses below and run the quiz again.`;
  $("redo").classList.toggle("hidden",missed.length===0);
  const box=$("misses"); box.innerHTML="";
  if(missed.length){
    const h=document.createElement("p"); h.innerHTML="<strong>Review these:</strong>"; box.appendChild(h);
    missed.forEach(m=>{
      const d=document.createElement("div"); d.className="miss";
      [["",m.q],["y","You picked: "+m.given],["c","Answer: "+m.ans],["x",m.e]].forEach(([c,t])=>{const p=document.createElement("p"); if(c)p.className=c; p.textContent=t; d.appendChild(p);});
      box.appendChild(d);
    });
  }
  show("done");
}

function buildKey(){
  const kb=$("keyBody"); kb.innerHTML="";
  [1,2,3].forEach(l=>{
    const sec=document.createElement("div"); sec.className="l"+l;
    const h=document.createElement("h3"); h.textContent=LNAME[l]; sec.appendChild(h);
    const ol=document.createElement("ol");
    POOL.filter(q=>q.l===l).forEach(q=>{
      const li=document.createElement("li");
      const a=document.createElement("div"); a.textContent=q.q;
      const b=document.createElement("div"); b.className="c"; b.textContent=q.o[q.a];
      li.append(a,b); ol.appendChild(li);
    });
    sec.appendChild(ol); kb.appendChild(sec);
  });
}

[1,2,3].forEach(l=>$("n"+l).textContent=POOL.filter(q=>q.l===l).length);
$("nAll").textContent=POOL.length;
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{ curMode=b.dataset.mode; begin(build(curMode)); });
$("again").onclick=()=>begin(build(curMode));
$("redo").onclick=()=>begin(shuffle(missed.map(({given,...q})=>({...q, opts: q.tf ? q.opts : shuffle(q.opts)}))));
$("home").onclick=()=>show("start");
$("quit").onclick=()=>show("start");
$("keyBtn").onclick=()=>{ buildKey(); show("key"); };
$("keyHome").onclick=()=>show("start");
</script>
